server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/axion_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:K4rth1ck13@}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update      # CHANGED: validate → update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

springdoc:
  swagger-ui:
    path: /swagger-ui
  api-docs:
    path: /api-docs
  default-produces-media-type: application/json
  default-consumes-media-type: application/json

axion:
  security:
    jwt:
      issuer: axion-api
      access-token-expiration: 31536000
      refresh-token-expiration: 31536000

  storage:
    local-path: ./storage/assets
    max-file-size: 10485760

  ai:
    base-url: http://localhost:8090